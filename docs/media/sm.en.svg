<text x="30" y="45" font-size="32" fill="#193741" font-weight="690" text-anchor="start">Inside one streaming multiprocessor</text>
<text x="30" y="72" font-size="17" fill="#147a75" font-weight="500" text-anchor="start">8 threads per warp    ·    4 physical lanes    ·    1 resident workgroup</text>
<rect x="30" y="107" width="276" height="65" rx="6" fill="#f3eff7" stroke="#beaccb" stroke-width="1.5"/>
<text x="46" y="134" font-size="19" fill="#755586" font-weight="650" text-anchor="start">Instruction L1 · 2 KiB</text>
<text x="46" y="156" font-size="14" fill="#193741" font-weight="400" text-anchor="start">HBM refill and hot line</text>
<rect x="353" y="107" width="658" height="65" rx="6" fill="#f3eff7" stroke="#beaccb" stroke-width="1.5"/>
<text x="369" y="134" font-size="19" fill="#755586" font-weight="650" text-anchor="start">4 resident warps and round-robin issue</text>
<text x="369" y="156" font-size="14" fill="#193741" font-weight="400" text-anchor="start">Per-warp PC, active mask, reconvergence stack and scoreboard</text>
<rect x="353" y="199" width="658" height="65" rx="6" fill="#ecf2f3" stroke="#96b1b6" stroke-width="1.5"/>
<text x="369" y="226" font-size="19" fill="#193741" font-weight="650" text-anchor="start">Warp slicing and register read</text>
<text x="369" y="248" font-size="14" fill="#193741" font-weight="400" text-anchor="start">Two slices per full warp. 32 × 32-bit registers per thread, three BRAM read copies.</text>
<rect x="30" y="305" width="467" height="66" rx="6" fill="#e9f4f1" stroke="#83b6aa" stroke-width="1.5"/>
<text x="46" y="332" font-size="19" fill="#147a75" font-weight="650" text-anchor="start">4 arithmetic lanes</text>
<text x="46" y="354" font-size="14" fill="#193741" font-weight="400" text-anchor="start">Integer ALU · FP32 FMA · cooperative INT8 matrix MAC</text>
<rect x="547" y="305" width="464" height="66" rx="6" fill="#e9f4f1" stroke="#83b6aa" stroke-width="1.5"/>
<text x="563" y="332" font-size="19" fill="#147a75" font-weight="650" text-anchor="start">Vector LSU</text>
<text x="563" y="354" font-size="14" fill="#193741" font-weight="400" text-anchor="start">Address/mask gather, one memory state machine</text>
<rect x="547" y="407" width="218" height="66" rx="6" fill="#fbf0e8" stroke="#ddaf95" stroke-width="1.5"/>
<text x="563" y="434" font-size="19" fill="#ae633c" font-weight="650" text-anchor="start">Scratchpad</text>
<text x="563" y="456" font-size="14" fill="#193741" font-weight="400" text-anchor="start">8 KiB · 4 banks</text>
<rect x="789" y="407" width="222" height="66" rx="6" fill="#fbf0e8" stroke="#ddaf95" stroke-width="1.5"/>
<text x="805" y="434" font-size="19" fill="#ae633c" font-weight="650" text-anchor="start">Global access</text>
<text x="805" y="456" font-size="14" fill="#193741" font-weight="400" text-anchor="start">Read-only L1 / bypass</text>
<rect x="30" y="507" width="981" height="60" rx="6" fill="#ecf2f3" stroke="#96b1b6" stroke-width="1.5"/>
<text x="46" y="534" font-size="19" fill="#193741" font-weight="650" text-anchor="start">Writeback arbitration → register file</text>
<text x="46" y="556" font-size="14" fill="#193741" font-weight="400" text-anchor="start">Arithmetic retirement has priority. Loads write active slices and unlock the warp after the final slice.</text>
</svg>
