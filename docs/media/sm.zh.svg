<path d="M777 264 V300" fill="none" stroke="#147a75" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#147a75)"/>
<path d="M683 371 V402" fill="none" stroke="#147a75" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#147a75)"/>
<path d="M900 371 V402" fill="none" stroke="#147a75" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#147a75)"/>
<path d="M246 371 V502" fill="none" stroke="#147a75" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#147a75)"/>
<path d="M660 473 V488 H788 V502" fill="none" stroke="#147a75" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#147a75)"/>
<path d="M900 473 V502" fill="none" stroke="#147a75" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#147a75)"/>
<path d="M30 535 H16 V228 H349" fill="none" stroke="#755586" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#755586)"/>
<text x="30" y="45" font-size="32" fill="#193741" font-weight="690" text-anchor="start">单个流式多处理器</text>
<text x="30" y="72" font-size="17" fill="#147a75" font-weight="500" text-anchor="start">8 线程 / warp    ·    4 条物理 lane    ·    每 SM 驻留 1 个工作组</text>
<rect x="30" y="107" width="276" height="65" rx="6" fill="#f3eff7" stroke="#beaccb" stroke-width="1.5"/>
<text x="46" y="134" font-size="19" fill="#755586" font-weight="650" text-anchor="start">指令 L1 · 2 KiB</text>
<text x="46" y="156" font-size="14" fill="#193741" font-weight="400" text-anchor="start">HBM 填充 · 最近指令行</text>
<rect x="353" y="107" width="658" height="65" rx="6" fill="#f3eff7" stroke="#beaccb" stroke-width="1.5"/>
<text x="369" y="134" font-size="19" fill="#755586" font-weight="650" text-anchor="start">4 个 warp 槽与轮询发射</text>
<text x="369" y="156" font-size="14" fill="#193741" font-weight="400" text-anchor="start">每 warp 的 PC、活动掩码、重汇合栈及 scoreboard</text>
<rect x="353" y="199" width="658" height="65" rx="6" fill="#ecf2f3" stroke="#96b1b6" stroke-width="1.5"/>
<text x="369" y="226" font-size="19" fill="#193741" font-weight="650" text-anchor="start">分拍与寄存器读取</text>
<text x="369" y="248" font-size="14" fill="#193741" font-weight="400" text-anchor="start">满掩码指令分两拍；32 × 32 位寄存器/线程，BRAM 三读副本</text>
<rect x="30" y="305" width="467" height="66" rx="6" fill="#e9f4f1" stroke="#83b6aa" stroke-width="1.5"/>
<text x="46" y="332" font-size="19" fill="#147a75" font-weight="650" text-anchor="start">4 条算术 lane</text>
<text x="46" y="354" font-size="14" fill="#193741" font-weight="400" text-anchor="start">整数 ALU · FP32 FMA · 协作式 INT8 矩阵 MAC</text>
<rect x="547" y="305" width="464" height="66" rx="6" fill="#e9f4f1" stroke="#83b6aa" stroke-width="1.5"/>
<text x="563" y="332" font-size="19" fill="#147a75" font-weight="650" text-anchor="start">向量 LSU</text>
<text x="563" y="354" font-size="14" fill="#193741" font-weight="400" text-anchor="start">收集地址与掩码，共用一套访存状态机</text>
<rect x="547" y="407" width="218" height="66" rx="6" fill="#fbf0e8" stroke="#ddaf95" stroke-width="1.5"/>
<text x="563" y="434" font-size="19" fill="#ae633c" font-weight="650" text-anchor="start">Scratchpad</text>
<text x="563" y="456" font-size="14" fill="#193741" font-weight="400" text-anchor="start">8 KiB · 4 个 bank</text>
<rect x="789" y="407" width="222" height="66" rx="6" fill="#fbf0e8" stroke="#ddaf95" stroke-width="1.5"/>
<text x="805" y="434" font-size="19" fill="#ae633c" font-weight="650" text-anchor="start">全局访存</text>
<text x="805" y="456" font-size="14" fill="#193741" font-weight="400" text-anchor="start">只读 D-L1 / DMA 旁路</text>
<rect x="30" y="507" width="981" height="60" rx="6" fill="#ecf2f3" stroke="#96b1b6" stroke-width="1.5"/>
<text x="46" y="534" font-size="19" fill="#193741" font-weight="650" text-anchor="start">写回仲裁 → 寄存器堆</text>
<text x="46" y="556" font-size="14" fill="#193741" font-weight="400" text-anchor="start">算术结果优先；load 按活动 lane 分拍写回，最后一拍释放 warp。</text>
</svg>
