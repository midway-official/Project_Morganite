<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="582" viewBox="0 0 1040 582" role="img" aria-labelledby="title" font-family="system-ui, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><title id="title">单个流式多处理器</title><defs><marker id="147a75" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#147a75"/></marker><marker id="755586" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#755586"/></marker><marker id="ae633c" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#ae633c"/></marker></defs><rect width="100%" height="100%" fill="#fbfcfa"/>
<path d="M306 139 H349" fill="none" stroke="#755586" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#755586)"/>
<path d="M683 172 V194" fill="none" stroke="#755586" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#755586)"/>
